<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#2f8fe6" />
    <title>Beach Volley</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #2f8fe6;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        font-family: system-ui, -apple-system, 'Hiragino Sans', sans-serif;
      }
      #game {
        position: fixed;
        inset: 0;
        display: block;
        touch-action: none;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        color: #fff;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
      }
      #hud .score {
        position: absolute;
        top: max(8px, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        font-size: 20px;
        display: flex;
        gap: 10px;
        background: rgba(0, 40, 90, 0.35);
        padding: 4px 14px;
        border-radius: 999px;
      }
      #hud .score b {
        font-size: 26px;
      }
      #hud .message {
        position: absolute;
        top: 30%;
        width: 100%;
        text-align: center;
        font-size: 28px;
        font-weight: 700;
        opacity: 0;
        transition: opacity 0.2s;
      }
      #hud .message.show {
        opacity: 1;
      }
      #jump {
        position: fixed;
        right: max(20px, env(safe-area-inset-right));
        bottom: max(20px, env(safe-area-inset-bottom));
        width: 84px;
        height: 84px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.85);
        background: rgba(255, 140, 40, 0.75);
        color: #fff;
        font-size: 18px;
        font-weight: 700;
        touch-action: none;
      }
      #jump:active {
        transform: scale(0.94);
      }
      #debug {
        position: fixed;
        left: max(4px, env(safe-area-inset-left));
        top: 4px;
        margin: 0;
        padding: 4px 6px;
        font: 8px/1.2 ui-monospace, Menlo, monospace;
        color: #0f0;
        background: rgba(0, 0, 0, 0.4);
        pointer-events: none;
        white-space: pre;
        max-width: 38vw;
        overflow: hidden;
      }
      #tune-toggle {
        position: fixed;
        top: max(8px, env(safe-area-inset-top));
        right: max(10px, env(safe-area-inset-right));
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.8);
        background: rgba(0, 40, 90, 0.5);
        color: #fff;
        font-size: 22px;
        z-index: 6;
      }
      #tune-panel {
        position: fixed;
        top: 56px;
        right: max(10px, env(safe-area-inset-right));
        bottom: 10px;
        width: min(300px, 40vw);
        overflow-y: auto;
        background: rgba(10, 25, 45, 0.82);
        color: #fff;
        font-size: 12px;
        padding: 8px 10px;
        border-radius: 10px;
        z-index: 5;
        touch-action: pan-y;
      }
      #tune-panel .tune-head {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      #tune-panel button {
        font-size: 12px;
        padding: 4px 8px;
        border-radius: 6px;
        border: 0;
      }
      #tune-panel .tune-status {
        font-size: 10px;
        word-break: break-all;
        margin-top: 4px;
        user-select: text;
        -webkit-user-select: text;
      }
      #tune-panel .tune-group {
        margin-top: 8px;
        font-weight: 700;
        color: #9fd6ff;
      }
      #tune-panel .tune-row {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        margin-top: 4px;
      }
      #tune-panel .tune-row input {
        grid-column: 1 / 3;
        width: 100%;
      }
      #tune-panel b.changed {
        color: #ffd23f;
      }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        background: #1d6fb8;
        color: #fff;
        font-size: 22px;
        align-items: center;
        justify-content: center;
        text-align: center;
        z-index: 10;
      }
      @media (orientation: portrait) {
        #tune-toggle {
        position: fixed;
        top: max(8px, env(safe-area-inset-top));
        right: max(10px, env(safe-area-inset-right));
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.8);
        background: rgba(0, 40, 90, 0.5);
        color: #fff;
        font-size: 22px;
        z-index: 6;
      }
      #tune-panel {
        position: fixed;
        top: 56px;
        right: max(10px, env(safe-area-inset-right));
        bottom: 10px;
        width: min(300px, 40vw);
        overflow-y: auto;
        background: rgba(10, 25, 45, 0.82);
        color: #fff;
        font-size: 12px;
        padding: 8px 10px;
        border-radius: 10px;
        z-index: 5;
        touch-action: pan-y;
      }
      #tune-panel .tune-head {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      #tune-panel button {
        font-size: 12px;
        padding: 4px 8px;
        border-radius: 6px;
        border: 0;
      }
      #tune-panel .tune-status {
        font-size: 10px;
        word-break: break-all;
        margin-top: 4px;
        user-select: text;
        -webkit-user-select: text;
      }
      #tune-panel .tune-group {
        margin-top: 8px;
        font-weight: 700;
        color: #9fd6ff;
      }
      #tune-panel .tune-row {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        margin-top: 4px;
      }
      #tune-panel .tune-row input {
        grid-column: 1 / 3;
        width: 100%;
      }
      #tune-panel b.changed {
        color: #ffd23f;
      }
      #rotate {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud"></div>
    <button id="jump" type="button">JUMP</button>
    <pre id="debug" hidden></pre>
    <div id="rotate">📱↻<br />横向きにしてね</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
